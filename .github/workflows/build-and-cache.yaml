name: Build & Cache flake outputs

on: push
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-cache:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: wimpysworld/nothing-but-nix@main
        with:
          root-safe-haven: "8192"
          mnt-safe-haven: "4096"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            
      - name: Install Attic and Omnix
        run: nix profile install nixpkgs#attic-client github:juspay/omnix

      - name: Attic login
        run: attic login central https://attic.supa.sh/ ${{ secrets.ATTIC_LOGIN_TOKEN }}

      - name: Use Attic cache
        run: attic use infra

      - name: Build flake outputs
        run: om ci run --extra-access-tokens ${{ secrets.GITHUB_TOKEN }} --results=$HOME/omci.json

      - name: Push to Attic
        run: attic push infra $HOME/omci.json
